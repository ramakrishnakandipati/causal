# GPU causal inference / uplift environment.
# Target: Windows 11, RTX 3090, NVIDIA driver with CUDA >= 13.2.
#
# Conda supplies only Python, pip and Graphviz. Everything else comes from pip
# because PyTorch no longer publishes Conda packages and CausalML's Windows
# binaries are built for PyPI wheels.
#
# Python 3.12 is deliberate: CausalML 0.18 ships Windows wheels for 3.11/3.12
# only, while current NumPy, XGBoost and SHAP require >= 3.12.
#
# DoWhy is deliberately absent: on Python 3.12 it requires scipy<=1.15.3 and
# CausalML requires scipy>=1.16. Give it a separate environment if needed.
name: causal-gpu
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - graphviz
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu132
      # The +cu132 local version can only come from the PyTorch index, so a
      # CPU build cannot be substituted silently.
      - torch==2.15.0+cu132
      - pyro-ppl==1.9.2
      - xgboost==3.4.1
      - lightgbm==4.7.0
      - causalml==0.18.0
      - econml==0.17.0
      # Compiled scientific stack, pinned to the set validated together.
      - numpy==2.5.4
      - scipy==1.18.1
      - pandas==3.1.1
      - scikit-learn==1.9.1
      - statsmodels==0.15.0
      - numba==0.68.1
      - shap==0.54.1
      - ipykernel
